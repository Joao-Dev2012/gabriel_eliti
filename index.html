<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador - ELITI</title> 

    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        
        body{
            min-height: 100dvh;
            display: grid;
            place-items: center;
            margin: 0;
            background: linear-gradient(yellow 30%, white 100%);
        }
        section{
            text-align: center;
            background:rgb(234, 255, 0) ;
            border: 5px solid black;
            padding: 35px;
            border-radius: 20px;
        }
        p{
            padding: 20px;
            font-size: 60px;
            padding-bottom: 50px;
            padding-top: 50px;
        }
        h1{
            font-family: Arial, Helvetica, sans-serif
        }
        button{
            font-size: 25px;
            background: rgb(0, 0, 0);
            color: white;
        }
    </style>
    
</head>
<body>
    <section>  
    <h1>CONTADOR</h1> 
    <p id="visor">0</p>

<button onclick="add()">mais</button>
<button onclick="zerar()">zerar</button>
<button onclick="dec()">menos</button>

    </section>
    <script>
    let valor=0;

function render(){
document.getElementById("visor").innerText=valor
}

 function add(){
    valor++
    render()
 }
 
 function dec(){
    valor--
    render()

 }
function zerar(){
    if (valor === 0){
        alert("valor já é zerado")
    }
    else{
        valor = 0
        render()
    }

 }

    </script>
</body>
</html>
